name: doxygen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'doxygen/**'
      - '!doxygen/README.md'
      - '.github/workflows/doxygen.yml'

env:
  REGISTRY_IMAGE: rodrigodornelles/doxygen
  CONTEXT: doxygen

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/386
            platform_name: linux-386
          - platform: linux/amd64
            platform_name: linux-amd64
          - platform: linux/arm/v5
            platform_name: linux-arm-v5
          - platform: linux/arm/v7
            platform_name: linux-arm-v7
          - platform: linux/arm64/v8
            platform_name: linux-arm64-v8
          - platform: linux/mips64le
            platform_name: linux-mips64le
          - platform: linux/ppc64le
            platform_name: linux-ppc64le
          - platform: linux/s390x
            platform_name: linux-s390x
        version:
          - latest
          - lua

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: version=${{ matrix.version }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests-${{ matrix.version }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests-${{ matrix.version }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.version }}-${{ matrix.platform_name }}
          path: /tmp/digests-${{ matrix.version }}/*
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - latest
          - lua

    needs:
      - build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          pattern: digests-${{ matrix.version }}-*
          path: /tmp/digests-${{ matrix.version }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests-${{ matrix.version }}
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:${{ matrix.version }} $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
